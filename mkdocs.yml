site_name: Receptbok
theme:
  name: material
  language: sv
  palette:
    primary: yellow
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand

plugins:
  - search
  - include_dir_to_nav:
      file_name_as_title: true

markdown_extensions:
  - pymdownx.tasklist:
      clickable_checkbox: true

nav:
  - Hem: index.md
  - recept

extra_css:
  - css/scaling.css

extra_javascript:
  - js/wakelock.js
  - js/scaling.js

extra:
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - manage 
      - reject